name: Test YAML Syntax

on:
  push:
    branches: [ feature/GitHub_Actions ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Test YAML files
      run: |
        pip install pyyaml
        python -c "import yaml, pathlib, sys; [yaml.safe_load(f.read_text()) for f in pathlib.Path('pipelines').glob('*.yml')] or print('✅ All YAMLs valid!')"
# CI trigger
